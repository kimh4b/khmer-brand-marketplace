@if (hasNoBrand()) {
  <div class="max-w-md mx-auto px-6 py-16 text-center">
    <p class="text-sm text-[var(--ink)]/60 mb-3">You need a brand before adding products.</p>
    <a routerLink="/create-brand" class="text-sm font-medium text-[var(--accent)] hover:underline">Create your brand</a>
  </div>
} @else {
  <div class="max-w-xl mx-auto px-6 py-14">
    <h1 class="display text-2xl mb-8">Add a product</h1>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs uppercase tracking-wide text-[var(--ink)]/50 mb-1">Name</label>
        <input [(ngModel)]="name" name="name" placeholder="Boxy tee" class="w-full border border-[var(--line)] bg-white px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)]" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs uppercase tracking-wide text-[var(--ink)]/50 mb-1">Price</label>
          <input [(ngModel)]="price" name="price" type="number" placeholder="0.00" class="w-full border border-[var(--line)] bg-white px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)]" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wide text-[var(--ink)]/50 mb-1">Size</label>
          <input [(ngModel)]="size" name="size" placeholder="M" class="w-full border border-[var(--line)] bg-white px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)]" />
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wide text-[var(--ink)]/50 mb-1">Category</label>
        <input [(ngModel)]="category" name="category" placeholder="Outerwear" class="w-full border border-[var(--line)] bg-white px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)]" />
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wide text-[var(--ink)]/50 mb-1">Description</label>
        <input [(ngModel)]="description" name="description" placeholder="Short description" class="w-full border border-[var(--line)] bg-white px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)]" />
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wide text-[var(--ink)]/50 mb-1">Photo URL</label>
        <input [(ngModel)]="photoUrl" name="photoUrl" placeholder="https://..." class="w-full border border-[var(--line)] bg-white px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)]" />
      </div>

      <button type="submit" class="w-full bg-[var(--ink)] text-[var(--paper)] py-2.5 text-sm font-medium hover:bg-[var(--accent)] transition">
        Create product
      </button>

      @if (errorMessage) {
        <p class="text-sm text-red-600">{{ errorMessage }}</p>
      }
    </form>
  </div>
}
